[package]
name = "splycefrontend"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-wdio = "1"
tauri-plugin-wdio-webdriver = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
