version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      development-tools:
        patterns: ["*"]
    # TypeScript 6/7 is the native compiler (typescript-go) and drops the
    # `typescript/bin/tsc` path our contracts runner resolves; a major bump
    # needs a deliberate toolchain migration, not a group update (#186).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
