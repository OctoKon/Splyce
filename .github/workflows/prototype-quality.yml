name: Prototype quality

on:
  pull_request:
    paths:
      - "apps/desktop/prototype/**"
      - ".github/workflows/prototype-quality.yml"
  push:
    branches: [main, staging]
    paths:
      - "apps/desktop/prototype/**"
      - ".github/workflows/prototype-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prototype-quality:
    name: Prototype quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/prototype
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Root .node-version (24.22.1) is not on this lineage yet; pin the same runtime here.
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: apps/desktop/prototype/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
